name: Release

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Release sync-native]
    types: [completed]
  workflow_dispatch:
    inputs:
      bump:
        description: Stable version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.event_name == 'workflow_dispatch' && 'stable' || 'canary' }}
  cancel-in-progress: false

jobs:
  canary:
    if: >-
      github.event_name == 'push' || (
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: select latest main build
        id: candidate
        run: bash scripts/release-candidate.sh

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.candidate.outputs.release == 'true'
        with:
          node-version: '24.22.1'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: install OIDC-capable npm
        if: steps.candidate.outputs.release == 'true'
        run: npm install --global npm@12.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.candidate.outputs.release == 'true'
        with:
          bun-version: 1.4.4

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        if: steps.candidate.outputs.release == 'true'
        with:
          toolchain: 1.94.0
          targets: wasm32-unknown-unknown

      - uses: ./.github/actions/setup-wasm-pack
        if: steps.candidate.outputs.release == 'true'

      - name: Cache canary builds
        if: steps.candidate.outputs.release == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.bun/install/cache
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: orez-canary-${{ runner.os }}-${{ hashFiles('bun.lock', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            orez-canary-${{ runner.os }}-${{ hashFiles('bun.lock', 'Cargo.lock') }}-
            orez-canary-${{ runner.os }}-

      - name: install dependencies
        if: steps.candidate.outputs.release == 'true'
        run: bun install --frozen-lockfile

      - name: publish canary with npm trusted publishing
        if: steps.candidate.outputs.release == 'true'
        run: bun scripts/release.ts --canary --ci --skip-test

  stable:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: verify current green main
        shell: bash
        run: |
          git fetch origin main --no-tags
          if [ '${{ github.ref }}' != 'refs/heads/main' ]; then
            echo 'stable releases must run from main' >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'stable releases must use the current main commit' >&2
            exit 1
          fi
          successful_ci_runs="$(
            gh api \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=completed&per_page=100" \
              --jq '[.workflow_runs[] | select(.conclusion == "success")] | length'
          )"
          if [ "$successful_ci_runs" -eq 0 ]; then
            echo "CI has not passed for $GITHUB_SHA" >&2
            exit 1
          fi
          version="$(node -p "require('./package.json').version")"
          if [ "$(git log -1 --pretty=%s)" = "v$version" ]; then
            echo "main already ends at stable release commit v$version" >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: install OIDC-capable npm
        run: npm install --global npm@12.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.94.0
          targets: wasm32-unknown-unknown

      - uses: ./.github/actions/setup-wasm-pack

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: configure release commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: publish stable release with npm trusted publishing
        run: bun scripts/release.ts --${{ inputs.bump }} --ci --skip-test
