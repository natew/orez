name: Publish sync-native package
description: Publish one prepared sync-native target and verify its launcher

inputs:
  version:
    description: Native package version
    required: true
  libc:
    description: Linux libc variant
    required: false

runs:
  using: composite
  steps:
    - name: Publish platform npm package
      shell: bash
      run: |
        package_name="$(node -p "require('./.release/platform/package.json').name")"
        if npm view "$package_name@${{ inputs.version }}" version --json >/dev/null 2>&1; then
          published_commit="$(npm view "$package_name@${{ inputs.version }}" orezSourceCommit)"
          if [ "$published_commit" != '${{ github.sha }}' ]; then
            echo "$package_name@${{ inputs.version }} came from $published_commit, not ${{ github.sha }}" >&2
            exit 1
          fi
          echo "$package_name@${{ inputs.version }} already has this source commit"
        else
          npm publish .release/platform --ignore-scripts --access public
        fi

    - name: Verify the published launcher
      shell: bash
      run: |
        # npm's package index can lag behind a published version. read both
        # version records directly and install their verified tarballs.
        package_name="$(node -p "require('./.release/platform/package.json').name")"
        platform_url="https://registry.npmjs.org/$package_name/${{ inputs.version }}"
        launcher_url="https://registry.npmjs.org/orez-sync-native/${{ inputs.version }}"
        platform_tarball=''
        launcher_tarball=''
        attempt=0
        while [ "$attempt" -lt 60 ]; do
          platform_tarball="$(curl --fail --silent --show-error \
            -H 'Cache-Control: no-cache' \
            "$platform_url?attempt=$attempt" 2>/dev/null \
            | jq -r \
              --arg version '${{ inputs.version }}' \
              --arg source_commit '${{ github.sha }}' \
              'if .version == $version and .orezSourceCommit == $source_commit then .dist.tarball // empty else empty end')" || platform_tarball=''
          launcher_tarball="$(curl --fail --silent --show-error \
            -H 'Cache-Control: no-cache' \
            "$launcher_url?attempt=$attempt" 2>/dev/null \
            | jq -r \
              --arg version '${{ inputs.version }}' \
              --arg source_commit '${{ github.sha }}' \
              'if .version == $version and .orezSourceCommit == $source_commit then .dist.tarball // empty else empty end')" || launcher_tarball=''
          if [ -n "$platform_tarball" ] && [ -n "$launcher_tarball" ]; then
            break
          fi
          attempt=$((attempt + 1))
          sleep 5
        done
        if [ -z "$platform_tarball" ] || [ -z "$launcher_tarball" ]; then
          echo "orez-sync-native@${{ inputs.version }} or $package_name@${{ inputs.version }} has not reached the registry in five minutes" >&2
          exit 1
        fi
        # installing the target explicitly exercises the launcher without
        # relying on resolution of its optional dependency from a stale cache.
        # the launcher picks its package by the host's libc, so a musl package
        # is verified on a musl host: on the glibc runner that built it, the
        # launcher looks for the glibc sibling instead, which a parallel job may
        # not have published yet.
        install="npm install --cache .release/smoke-cache --prefix .release/smoke --ignore-scripts --omit=optional"
        if [ '${{ inputs.libc }}' = 'musl' ]; then
          docker run --rm -v "$PWD/.release:/work/.release" -w /work node:24-alpine \
            sh -euc "$install \"\$1\" \"\$2\" >&2 && .release/smoke/node_modules/.bin/sync-native --version" \
            sh "$launcher_tarball" "$platform_tarball" > .release/smoke-version
          actual="$(cat .release/smoke-version)"
        else
          $install "$launcher_tarball" "$platform_tarball"
          actual="$(.release/smoke/node_modules/.bin/sync-native --version)"
        fi
        case "$actual" in
          'sync-native ${{ inputs.version }} core'*) ;;
          *)
            echo "expected 'sync-native ${{ inputs.version }} core<schema revision>', got '$actual'" >&2
            exit 1
            ;;
        esac
